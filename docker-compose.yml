# Production stack: postgres + backend API + frontend, both self-hosted on
# this box at businesscard.arundopower.com (single origin — see
# /opt/docker/reverse-proxy/traefik/dynamic/businesscard.yml, which routes
# PathPrefix(/api) to cardreader-backend and everything else to
# cardreader-frontend). Frontend and backend no longer live on separate
# origins, so CORS is only needed for local cross-port dev now.
#
# cardreader-frontend runs a production build (Nitro node-server preset, see
# Dockerfile), not a dev server — this is the public production domain, so
# `docker compose up -d --build cardreader-frontend` is how you deploy a
# frontend change, not a bind mount.
#
# Traefik labels below are decoration, kept for consistency with this
# workspace's other apps — this box's Traefik runs file-provider only, so the
# dynamic/businesscard.yml file is what actually routes traffic.
services:
  postgres:
    image: postgres:17-alpine
    container_name: cardreader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cardreader}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cardreader-net

  cardreader-backend:
    build: ./backend
    container_name: cardreader-backend
    restart: unless-stopped
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - backend-node-modules:/app/backend/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8090
      DATABASE_URL: postgres://${POSTGRES_USER:-cardreader}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-cardreader}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3020}
    ports:
      - "8090:8090"
    depends_on:
      - postgres
    networks:
      - cardreader-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cardreader-backend.rule=Host(`businesscard.arundopower.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.cardreader-backend.entrypoints=websecure"
      - "traefik.http.services.cardreader-backend.loadbalancer.server.port=8090"

  cardreader-frontend:
    build: .
    container_name: cardreader-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3020
    ports:
      - "3020:3020"
    depends_on:
      - cardreader-backend
    networks:
      - cardreader-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cardreader-frontend.rule=Host(`businesscard.arundopower.com`)"
      - "traefik.http.routers.cardreader-frontend.entrypoints=websecure"
      - "traefik.http.services.cardreader-frontend.loadbalancer.server.port=3020"

networks:
  cardreader-net:
  traefik-net:
    external: true

volumes:
  postgres-data:
  backend-node-modules:
